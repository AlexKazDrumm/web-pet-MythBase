services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mythbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mythbase}
      POSTGRES_DB: ${POSTGRES_DB:-mythbase}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mythbase} -d ${POSTGRES_DB:-mythbase}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./back
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${API_DATABASE_URL:-postgres://mythbase:mythbase@db:5432/mythbase}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

  seed:
    build: ./back
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${API_DATABASE_URL:-postgres://mythbase:mythbase@db:5432/mythbase}
      SEED_FORCE: ${SEED_FORCE:-false}
    command: ["node", "dist/db/seed.js"]

volumes:
  db-data:
